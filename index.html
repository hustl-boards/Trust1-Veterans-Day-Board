<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c1220" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%230c1220' width='16' height='16'/%3E%3Cpath fill='%23f0d48a' d='M8 2.2l1.3 3.6h3.7l-3 2.3 1.2 3.7L8 9.6 4.8 11.8l1.2-3.7-3-2.3h3.7z'/%3E%3C/svg%3E" />
  <title>Trust 1 Services Veterans Day Office TV</title>
  <link rel="stylesheet" href="styles.css?v=20261030a" />
</head>
<body>
  <main id="stage" aria-label="Trust 1 Services Veterans Day office slideshow">
    <video id="vid" class="clip" muted playsinline preload="none"></video>
    <video id="vid-next" class="clip" muted playsinline preload="none"></video>
    <div id="fade"></div>
    <div id="fit">
      <div id="screen">
        <div id="mask" aria-hidden="true"></div>
        <div id="brand" class="title">
          <img id="logo" src="assets/trust1-logo.png?v=20261030a" width="968" height="420" alt="Trust 1 Services Plumbing, Heating and Air Conditioning" draggable="false" />
          <p id="signoff">Thank you to all who served — from Trust 1 Services</p>
        </div>
      </div>
    </div>
    <div id="progress"><span></span></div>
    <div id="countdown" aria-live="off"></div>
    <div id="counter" aria-live="polite"></div>
    <div id="controls">
      <button id="prev" type="button" aria-label="Previous clip">◀</button>
      <button id="pause" type="button" aria-label="Pause slideshow">Ⅱ</button>
      <button id="next" type="button" aria-label="Next clip">▶</button>
      <button id="sound" type="button" aria-label="Turn sound on">🔇</button>
      <button id="full" type="button" aria-label="Fullscreen">⛶</button>
    </div>
  </main>
  <script src="clips.js?v=20261030a"></script>
  <script src="app.js?v=20261030a"></script>
</body>
</html>
